name: Deploy Ibermar a IONOS

# Despliega automáticamente en cada push a main.
# NO expone contraseñas: se leen de los "Secrets" del repositorio de GitHub.
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   FTP_SERVER      -> host FTP de IONOS (ej. access-XXXXXX.webspace-host.com)
#   FTP_USERNAME    -> usuario FTP/SFTP
#   FTP_PASSWORD    -> contraseña FTP/SFTP
#   FTP_SERVER_DIR  -> carpeta de destino del subdominio (ej. /ibermar/  o  /  )

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (Vite)
        run: npm run build

      - name: Subir dist/ por FTP a IONOS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
